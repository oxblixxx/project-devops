services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - ${HOMEDIRECTORY}:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.rule=Host(`upk.${DOMAINNAME}`)"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.routers.uptime-kuma.service=uptime-kuma"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      - "traefik.http.routers.uptime-kuma.middlewares=redirect@file"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=dns-cloudflare"
networks:
  traefik:
    external: true
