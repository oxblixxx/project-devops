==========================================================
# 🔰 NGINX GLOBAL FORTRESS CONFIGURATION
# Context: http {}
# Purpose: Secure, performant, production-safe defaults
# STRICT CSP - NO unsafe-inline/unsafe-eval
# ==========================================================

# ----------------------
# 🔒 Security Hardening
# ----------------------
server_tokens off;

# Connection limiting per IP (DDoS protection)
limit_conn_zone $binary_remote_addr zone=global_conn:10m;

# ----------------------
# 🛡️ Global Security Headers (STRICT CSP)
# ----------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# STRICT CSP - Blocks ALL inline scripts/styles
add_header Content-Security-Policy "
default-src 'self';
script-src 'self' https:;
style-src 'self' https:;
img-src 'self' https: data: blob:;
font-src 'self' https: data:;
connect-src 'self' https:;
media-src 'self' https:;
object-src 'none';
base-uri 'self';
frame-ancestors 'self';
form-action 'self';
" always;

# ----------------------
# 🚫 HTTP Method Control
# ----------------------
# Blocks dangerous/uncommon methods
if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$ ) {
return 405 "Method Not Allowed";
}

# ----------------------
# 🚦 Rate Limiting (DDoS Protection)
# ----------------------
limit_req_zone $binary_remote_addr zone=global_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=global_conn:10m;

# ----------------------
# ⚙️ Performance & Compression
# ----------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_min_length 1024;
gzip_types
text/plain text/css text/xml text/javascript
application/json application/javascript application/xml+rss
image/svg+xml
font/ttf font/opentype font/woff font/woff2;

# Anti slowloris timeouts
client_body_timeout 12;
client_header_timeout 12;
keepalive_timeout 65;
send_timeout 10;

# ----------------------
# 🗂️ Static Asset Caching
# ----------------------
map $sent_http_content_type $expires {
default 0;
~image/ 30d;
~text/css 1y;
~application/javascript 1y;
~font/ 1y;
}

# ----------------------
# 🧾 Structured JSON Logging (SEPARATE FILES)
# ----------------------
log_format json_access escape=json '{'
'"time":"$time_local",'
'"remote_addr":"$remote_addr",'
'"x_forwarded_for":"$http_x_forwarded_for",'
'"request_method":"$request_method",'
'"request_uri":"$request_uri",'
'"status":$status,'
'"bytes_sent":$body_bytes_sent,'
'"request_time":$request_time,'
'"upstream_time":$upstream_response_time,'
'"referer":"$http_referer",'
'"user_agent":"$http_user_agent"'
'}';

log_format json_error escape=json '{'
'"time":"$time_local",'
'"remote_addr":"$remote_addr",'
'"error_level":"$level",'
'"error_message":"$msg",'
'"request_method":"$request_method",'
'"request_uri":"$request_uri"'
'}';

# Separate access and error logs
access_log /var/log/nginx/access_json.log json_access;
error_log /var/log/nginx/error_json.log json_error;


# ----------------------
# 📋 Usage Instructions
# ----------------------
# In server/location blocks, add:
# limit_req zone=global_rate burst=20 nodelay;
# limit_conn global_conn 20;
# expires $expires;"
