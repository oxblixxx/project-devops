---
- name: Deploy Docker Compose applications
  hosts: webservers   # or your target server group
  become: yes       # run with sudo
  vars:
    # List of directories containing docker-compose.yml files
    compose_projects:
      - 
      - ../ansible-playbook/Traefik
      - ../ansible-playbook/Authentik
      - ../ansible-playbook/Grafana
      - ../ansible-playbook/Uptime-kuma
      - ../ansible-playbook/Vaultwarden
      - ../ansible-playbook/A

  tasks:
    - name: Set acme.json permission
      ansible.builtin.command:
         cmd: "chmod 600 acme.json"
         chdir: "../ansible-playbook/Traefik/config"
    - name: Start Docker Compose services
      ansible.builtin.command:
        cmd: "docker compose up -d"
        chdir: "{{ item }}"
      loop: "{{ compose_projects }}"
      register: compose_result
      changed_when: "'Creating' in compose_result.stdout"