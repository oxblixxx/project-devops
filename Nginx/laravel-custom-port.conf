# ---------------------- Laravel on Custom Port 8080 ----------------------
server {
    listen 8080;
    #server_name laravel-custom;  # or localhost

    # Fortress protections
    limit_req zone=global_rate burst=10 nodelay;
    limit_conn global_conn 10;
    expires $expires;

    root /var/www/laravel-custom/public;
    index index.php;

    # Error handling
    fastcgi_intercept_errors on;
    error_page 400 401 403 404 405 /40x.html;
    error_page 500 502 503 504 /50x.html;

    location = /40x.html {
        internal;
        default_type text/html;
        return 404 "<h1>404 - Page Not Found</h1><p>Laravel resource not found on port 8080.</p>";
    }

    location = /50x.html {
        internal;
        default_type text/html;
        return 500 "<h1>500 - Server Error</h1><p>Laravel server issue on port 8080.</p>";
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Security - block sensitive files
    location ~ /\.(?!well-known).* { deny all; }
    location ~* /(composer\.(json|lock)|artisan|package\.json|webpack\.mix\.js|\.env)$ { deny all; }
    location ~* ^/(storage|uploads|files)/.*\.php$ { deny all; }
}
