### THIS DOCKER COMPOSE FILE IS USED TO DOCKERIZE A LARAVEL APP WITH A WEBSERVER FOR PRODUCTION ENVIRONMENT.
version: "3"
services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www # Mount the current directory to /var/www in the container
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network

  # Nginx Service
  webserver:
    build:
      context: ./.docker/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: webserver
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www # Mount the current directory to /var/www in the container
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/
      - "$CERTDIR/conf:/etc/letsencrypt"
      - "$CERTDIR/www:/var/www/certbot" 
    networks:
      - app-network
  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - "$CERTDIR/conf:/etc/letsencrypt"
      - "$CERTDIR/www:/var/www/certbot"
    command: certonly --webroot -w /var/www/certbot --email xxxx@gmail.com --agree-tos --no-eff-email --force-renewal -d xxxxx.in
    depends_on:
     - webserver
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge