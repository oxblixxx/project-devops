# ==========================================================
# 🔰 NGINX GLOBAL FORTRESS CONFIGURATION
# Works under the 'http' context (safe for all sites)
# ==========================================================

# ----------------------
# 🔒 Security Hardening
# ----------------------

# Hide Nginx version
server_tokens off;

# Block unwanted HTTP methods globally
#if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|OPTIONS)$) {
#    return 405;
#}

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'" always;

# ----------------------
# 🚦 Request Control
# ----------------------
limit_req_zone $binary_remote_addr zone=global_rate:10m rate=10r/s;

# ----------------------
# ⚙️ Optimization
# ----------------------
#gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  text/xml
  application/xml
  application/xml+rss
  text/javascript
  image/svg+xml
  application/font-woff2
  application/font-woff
  application/vnd.ms-fontobject
  font/ttf
  font/opentype;
gzip_min_length 1024;


#gzip on;
#gzip_disable "msie6";
#gzip_vary on;
#gzip_proxied any;
#gzip_comp_level 6;
#gzip_buffers 16 8k;
#gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml application/font-woff2;

# Cache headers for static assets (applied in each server context)
map $sent_http_content_type $expires {
    default                    off;
    ~image/                    30d;
    ~text/css                  30d;
    ~application/javascript    30d;
    ~font/                     30d;
}

# ----------------------
# 🧾 Structured Logging
# ----------------------
log_format json_combined escape=json '{'
  '"time_local":"$time_local",'
  '"remote_addr":"$remote_addr",'
  '"request":"$request",'
  '"status": "$status",'
  '"body_bytes_sent":"$body_bytes_sent",'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"'
'}';
access_log /var/log/nginx/access_json.log json_combined;
